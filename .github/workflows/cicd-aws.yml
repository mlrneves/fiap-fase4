name: CI-CD AWS EKS

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_USERS_REPOSITORY: fcg-users-api
  ECR_CATALOG_REPOSITORY: fcg-catalog-api
  ECR_PAYMENTS_REPOSITORY: fcg-payments-api
  ECR_GATEWAY_REPOSITORY: fcg-gateway-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore users-api solution
        run: dotnet restore ./users-api_fase3/FCGUsersAPI.sln

      - name: Build users-api solution
        run: dotnet build ./users-api_fase3/FCGUsersAPI.sln --configuration Release --no-restore

      - name: Test users-api solution
        run: dotnet test ./users-api_fase3/FCGUsersAPI.sln --configuration Release --no-build --verbosity normal

      - name: Restore catalog-api solution
        run: dotnet restore ./catalog-api_fase3/FCGCatalogAPI.sln

      - name: Build catalog-api solution
        run: dotnet build ./catalog-api_fase3/FCGCatalogAPI.sln --configuration Release --no-restore

      - name: Test catalog-api solution
        run: dotnet test ./catalog-api_fase3/FCGCatalogAPI.sln --configuration Release --no-build --verbosity normal

      - name: Restore payments-api solution
        run: dotnet restore ./payments-api_fase3/FCGPaymentsAPI.sln

      - name: Build payments-api solution
        run: dotnet build ./payments-api_fase3/FCGPaymentsAPI.sln --configuration Release --no-restore

      - name: Test payments-api solution
        run: dotnet test ./payments-api_fase3/FCGPaymentsAPI.sln --configuration Release --no-build --verbosity normal

      - name: Restore gateway solution
        run: dotnet restore ./GatewayAPI/GatewayAPI/GatewayAPI.csproj

      - name: Build gateway solution
        run: dotnet build ./GatewayAPI/GatewayAPI/GatewayAPI.csproj --configuration Release --no-restore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        shell: bash
        run: |
          for repo in "$ECR_USERS_REPOSITORY" "$ECR_CATALOG_REPOSITORY" "$ECR_PAYMENTS_REPOSITORY" "$ECR_GATEWAY_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$repo"
          done

      - name: Set image tags
        shell: bash
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "USERS_IMAGE=${REGISTRY}/${ECR_USERS_REPOSITORY}:${SHORT_SHA}"     >> $GITHUB_ENV
          echo "CATALOG_IMAGE=${REGISTRY}/${ECR_CATALOG_REPOSITORY}:${SHORT_SHA}" >> $GITHUB_ENV
          echo "PAYMENTS_IMAGE=${REGISTRY}/${ECR_PAYMENTS_REPOSITORY}:${SHORT_SHA}" >> $GITHUB_ENV
          echo "GATEWAY_IMAGE=${REGISTRY}/${ECR_GATEWAY_REPOSITORY}:${SHORT_SHA}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "REGISTRY=${REGISTRY}"   >> $GITHUB_ENV

      - name: Build and push users-api image
        run: |
          docker build -t ${{ env.USERS_IMAGE }} ./users-api_fase3
          docker tag ${{ env.USERS_IMAGE }} ${{ env.REGISTRY }}/${{ env.ECR_USERS_REPOSITORY }}:latest
          docker push ${{ env.USERS_IMAGE }}
          docker push ${{ env.REGISTRY }}/${{ env.ECR_USERS_REPOSITORY }}:latest

      - name: Build and push catalog-api image
        run: |
          docker build -t ${{ env.CATALOG_IMAGE }} ./catalog-api_fase3
          docker tag ${{ env.CATALOG_IMAGE }} ${{ env.REGISTRY }}/${{ env.ECR_CATALOG_REPOSITORY }}:latest
          docker push ${{ env.CATALOG_IMAGE }}
          docker push ${{ env.REGISTRY }}/${{ env.ECR_CATALOG_REPOSITORY }}:latest

      - name: Build and push payments-api image
        run: |
          docker build -t ${{ env.PAYMENTS_IMAGE }} ./payments-api_fase3
          docker tag ${{ env.PAYMENTS_IMAGE }} ${{ env.REGISTRY }}/${{ env.ECR_PAYMENTS_REPOSITORY }}:latest
          docker push ${{ env.PAYMENTS_IMAGE }}
          docker push ${{ env.REGISTRY }}/${{ env.ECR_PAYMENTS_REPOSITORY }}:latest

      - name: Build and push gateway-api image
        run: |
          docker build -t ${{ env.GATEWAY_IMAGE }} ./GatewayAPI/GatewayAPI
          docker tag ${{ env.GATEWAY_IMAGE }} ${{ env.REGISTRY }}/${{ env.ECR_GATEWAY_REPOSITORY }}:latest
          docker push ${{ env.GATEWAY_IMAGE }}
          docker push ${{ env.REGISTRY }}/${{ env.ECR_GATEWAY_REPOSITORY }}:latest

  deploy-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Apply namespace and configmaps
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmaps/

      - name: Apply / update K8s secrets
        shell: bash
        run: |
          SQL_PASS="${{ secrets.SQL_SA_PASSWORD }}"
          kubectl create secret generic fcg-secrets \
            --namespace fcg \
            --from-literal=SQL_SA_PASSWORD="${SQL_PASS}" \
            --from-literal=USERS_CONNECTION_STRING="Server=sqlserver;Database=FCGUsers;User Id=sa;Password=${SQL_PASS};TrustServerCertificate=True" \
            --from-literal=CATALOG_CONNECTION_STRING="Server=sqlserver;Database=FCGCatalog;User Id=sa;Password=${SQL_PASS};TrustServerCertificate=True" \
            --from-literal=PAYMENTS_CONNECTION_STRING="Server=sqlserver;Database=FCGPayments;User Id=sa;Password=${SQL_PASS};TrustServerCertificate=True" \
            --from-literal=JWT_KEY="${{ secrets.JWT_KEY }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            --from-literal=INTERNAL_API_KEY="${{ secrets.INTERNAL_API_KEY }}" \
            --from-literal=DD_API_KEY="${{ secrets.DD_API_KEY }}" \
            --from-literal=REDIS_CONNECTION="redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure (Redis, SQL Server, Datadog)
        run: |
          kubectl apply -f k8s/sqlserver/
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/datadog/

      - name: Set image tag from git SHA
        run: |
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "USERS_IMAGE=${REGISTRY}/fcg-users-api:${SHORT_SHA}"    >> $GITHUB_ENV
          echo "CATALOG_IMAGE=${REGISTRY}/fcg-catalog-api:${SHORT_SHA}" >> $GITHUB_ENV
          echo "PAYMENTS_IMAGE=${REGISTRY}/fcg-payments-api:${SHORT_SHA}" >> $GITHUB_ENV
          echo "GATEWAY_IMAGE=${REGISTRY}/fcg-gateway-api:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Deploy APIs (Rolling Update)
        run: |
          # Aplica os manifests base (cria deployments se não existirem)
          kubectl apply -f k8s/users-api/
          kubectl apply -f k8s/catalog-api/
          kubectl apply -f k8s/payments-api/
          kubectl apply -f k8s/gateway-api/

          # Atualiza as imagens para o SHA do commit atual
          kubectl set image deployment/users-api   users-api=${{ env.USERS_IMAGE }}   -n fcg
          kubectl set image deployment/catalog-api  catalog-api=${{ env.CATALOG_IMAGE }}  -n fcg
          kubectl set image deployment/payments-api payments-api=${{ env.PAYMENTS_IMAGE }} -n fcg
          kubectl set image deployment/gateway-api  gateway-api=${{ env.GATEWAY_IMAGE }}  -n fcg

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/users-api   -n fcg --timeout=180s
          kubectl rollout status deployment/catalog-api  -n fcg --timeout=180s
          kubectl rollout status deployment/payments-api -n fcg --timeout=180s
          kubectl rollout status deployment/gateway-api  -n fcg --timeout=180s

      - name: Show pods status
        run: kubectl get pods -n fcg
