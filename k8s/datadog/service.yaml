apiVersion: v1
kind: Service
metadata:
  name: datadog-agent
  namespace: fcg
spec:
  selector:
    app: datadog-agent
  ports:
    - name: apm
      port: 8126
      targetPort: 8126
      protocol: TCP
    - name: statsd
      port: 8125
      targetPort: 8125
      protocol: UDP
  type: ClusterIP
