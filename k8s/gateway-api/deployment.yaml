apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: AWS_ACCOUNT_ID.dkr.ecr.us-east-2.amazonaws.com/fcg-gateway-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          volumeMounts:
            - name: yarp-config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: yarp-config
          configMap:
            name: gateway-yarp-config
